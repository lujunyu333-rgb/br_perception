# ═══════════════════════════════════════════════════════════════════════════════
# color_thresholds.yaml — 传统 CV HSV 颜色阈值
#
# 每个颜色可配置 1~N 组阈值，检测时取并集 (mask = group1 | group2 | ...).
# 只在确实需要多段覆盖时才加多组 (如红色跨 0°/180°).
# ⚠️  比赛现场必须重新校准！
# ═══════════════════════════════════════════════════════════════════════════════

# ── 红色队伍 (RGB: 223-34-34) ──
# Hue 跨越 0°/180° 边界，三组全覆盖红-粉-暗红
red_team:
  groups:
    - { lower: [0,   100, 50],  upper: [8,   255, 255] }   # 0°附近正红
    - { lower: [170, 100, 50],  upper: [180, 255, 255] }   # 180°附近正红
    - { lower: [0,   30,  50],  upper: [180, 99,  255] }   # 低饱和兜底 (暗红/粉)

# ── 蓝色队伍 (RGB: 50-0-255) ──
blue_team:
  groups:
    - { lower: [100, 80,  40],  upper: [130, 255, 255] }
    - { lower: [95,  40,  40],  upper: [135, 255, 255] }   # 暗光补偿

# ── 金色穆斯蒂卡 (RGB: 218-165-32) ──
golden_mustika:
  groups:
    - { lower: [18,  80,  60],  upper: [35,  255, 255] }
    - { lower: [15,  50,  50],  upper: [38,  255, 230] }   # 暗光补偿

# ── 深绿色穆斯蒂卡柱 (RGB: 40-100-50) ──
dark_green_pillar:
  groups:
    - { lower: [40,  60,  30],  upper: [80,  255, 180] }
    - { lower: [35,  40,  25],  upper: [85,  255, 150] }   # 暗光补偿

# ── 棕色核心支柱 (RGB: 100-62-0) ──
brown_core_pillar:
  groups:
    - { lower: [10,  60,  25],  upper: [28,  255, 180] }
    - { lower: [8,   40,  20],  upper: [30,  255, 150] }   # 暗光补偿

# ── 绿色建筑点位 (RGB: 40-100-50) ──
green_building_spot:
  groups:
    - { lower: [40,  60,  30],  upper: [80,  255, 180] }
    - { lower: [35,  40,  25],  upper: [85,  255, 150] }   # 暗光补偿

# ── 棕色围栏/边界 (RGB: 100-62-0) ──
brown_fence:
  groups:
    - { lower: [10,  60,  25],  upper: [28,  255, 200] }
    - { lower: [8,   40,  20],  upper: [30,  255, 160] }   # 暗光补偿

# ── 浅色区域 (地板、白线等) ──
light_colors:
  groups:
    - { lower: [0,   0,   150], upper: [180, 50,  255] }
    - { lower: [0,   0,   100], upper: [180, 70,  255] }   # 灰白扩展

# ── 后处理参数 ──
morphology_kernel_size: 3         # 形态学操作 (开/闭运算) 核大小
min_color_pixel_ratio: 0.7         # 判定颜色归属的最小像素占比
